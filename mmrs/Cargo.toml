[package]
name = "mmrs"
version.workspace = true
edition.workspace = true

[dependencies]
aes-gcm = "0.11.1"
anyhow = "1.0.104"
arrayvec = "0.7.8"
async-nats = "0.50.0"
axum = { version = "0.8.9", features = ["ws"] }
axum-server = { version = "0.8.0", default-features = false, features = ["tls-rustls-no-provider"] }
chacha20poly1305 = "0.11.0"
dotenvy = "0.15.7"
futures-util = { version = "0.3.34", default-features = false }
getrandom = "0.4.3"
hmac = "0.13"
mmrs-protocol = { version = "0.1.0", path = "../mmrs-protocol" }
p256 = { version = "0.14.0", features = ["ecdsa"] }
parking_lot = "0.12.5"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12", "logging"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.152"
sha1 = "0.11"
sha2 = "0.11.1"
str0m = { version = "0.24.1", default-features = false, features = ["rust-crypto"] }
tokio = { version = "1.53.2", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter"] }
